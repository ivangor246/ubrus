[package]
name = "ubrus"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
gdk4-x11 = "0.10"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "image-without-codecs", "thread-pool", "x11", "wayland"] }
# Iced reads the library's PNG posters. GStreamer and GdkPixbuf decode imported media.
image = { version = "0.25", default-features = false, features = ["png"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std", "raw_handle", "wayland"] }
async-channel = "2"
gst = { package = "gstreamer", version = "0.24", features = ["v1_24"] }
gst-video = { package = "gstreamer-video", version = "0.24" }
gst-app = { package = "gstreamer-app", version = "0.24" }
gstgtk4 = { package = "gst-plugin-gtk4", version = "0.14", features = ["static", "dmabuf", "wayland", "x11egl", "x11glx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
futures-channel = "0.3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
