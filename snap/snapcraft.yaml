name: ubrus
base: core24
version: '0.2.0'
summary: Choose still and animated wallpapers for each monitor
description: |
  Import local images, videos and GIFs, preview them and set your GNOME desktop
  background. Supports Ubuntu 24.04 and 26.04 on amd64 with GNOME Shell 46 or
  50. For animation or separate monitor backgrounds, install the companion
  extension from the bundled ZIP, sign out and back in, then enable Ubrus.
  The app's Diagnostics screen includes the installation command.
grade: stable
confinement: strict
license: MIT OR Apache-2.0
website: https://github.com/ivangor246/ubrus
issues: https://github.com/ivangor246/ubrus/issues
contact: https://github.com/ivangor246/ubrus/issues
platforms:
  amd64:
apps:
  ubrus:
    command: bin/ubrus
    desktop: usr/share/applications/org.ubrus.Ubrus.desktop
    extensions: [gnome]
    autostart: ubrus-login.desktop
    slots: [wallpaper]
    plugs: [opengl, wayland, x11, desktop, desktop-legacy]
slots:
  wallpaper:
    interface: dbus
    bus: session
    name: org.ubrus.Ubrus
parts:
  rust-deps:
    plugin: nil
    source: https://static.rust-lang.org/dist/rust-1.100.0-x86_64-unknown-linux-gnu.tar.xz
    source-checksum: sha256/98ee6bec240e1cfe944f17e7092412dc5ef6e008484bb668c6936d35a7d15acd
    override-build: |
      ./install.sh --prefix="$CRAFT_PART_INSTALL/opt/ubrus-rust" \
        --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu --disable-ldconfig
    prime: ['-*']
  ubrus:
    plugin: rust
    source: .
    after: [rust-deps]
    rust-channel: none
    build-environment:
      - PATH: "$CRAFT_STAGE/opt/ubrus-rust/bin:$PATH"
      - CARGO_BUILD_JOBS: '1'
    build-packages:
      - libgtk-4-dev
      - libgstreamer-plugins-base1.0-dev
      - libdrm-dev
      - libx11-dev
    stage-packages:
      - gstreamer1.0-libav
      - webp-pixbuf-loader
    override-build: |
      cargo build --locked --release --jobs 1
      install -Dm755 target/release/ubrus "$CRAFT_PART_INSTALL/bin/ubrus"
      bash packaging/extension.sh
      bash packaging/snap/install.sh "$CRAFT_PART_INSTALL"
